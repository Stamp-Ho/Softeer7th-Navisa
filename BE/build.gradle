plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.navisa'
version = '0.0.1-SNAPSHOT'
description = 'BE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Database & Vector Search
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.pgvector:pgvector:0.1.6'
    implementation 'org.hibernate.orm:hibernate-vector:6.6.1.Final'
    testImplementation 'com.h2database:h2'

    // Querydsl 5.1.0
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Flyway Core & PostgreSQL
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // AWS & S3
    implementation platform("software.amazon.awssdk:bom:2.41.19")
    implementation "software.amazon.awssdk:s3"

    // Auth (JWT & BCrypt)
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'org.mindrot:jbcrypt:0.4'

    // Utilities & API Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'
    implementation 'me.paulschwarz:spring-dotenv:5.1.0'
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.100.Final:osx-aarch_64'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Testcontainers
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.icegreen:greenmail-junit5:2.0.1'

    // mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Jackson extension for Java 8 time
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ShedLock
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.6.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:7.6.0'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true // CI가 읽을 XML 활성화
        html.required = true // 사람이 볼 HTML 활성화
    }

    // Querydsl QClass 및 DTO 등을 리포트에서 제외
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude "**/Q*"
        exclude "**/*Request*"
        exclude "**/*Response*"
        exclude "**/*Application*"
        exclude "**/com/navisa/be/common/config/**"
    })
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude "**/Q*"
        exclude "**/*Request*"
        exclude "**/*Response*"
        exclude "**/*Application*"
        exclude "**/com/navisa/be/common/config/**"
    })

    violationRules {
        rule {
            element = 'BUNDLE'

            limit {
                counter = 'BRANCH' // 커버리지 측정 단위를 BRANCH로 설정
                value = 'COVEREDRATIO'
                minimum = 0.50 // 전체 브랜치 커버리지 최소 50%
            }
        }
    }
}


