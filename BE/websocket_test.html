<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>STOMP Chat Integration Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 20px;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            background-color: #f4f7f6;
        }

        #logs {
            border: 1px solid #ccc;
            padding: 15px;
            height: 350px;
            overflow-y: scroll;
            background: #2b2b2b;
            color: #f8f8f2;
            margin-top: 10px;
            font-size: 13px;
            border-radius: 5px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .info {
            color: #66d9ef;
        }

        .error {
            color: #f92672;
        }

        .success {
            color: #a6e22e;
        }

        .msg {
            color: #e6db74;
            font-weight: bold;
            border-left: 3px solid #e6db74;
            padding-left: 10px;
            margin: 8px 0;
            background: rgba(230, 219, 116, 0.1);
        }

        .panel {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: inline-block;
            width: 130px;
            font-weight: bold;
            color: #444;
        }

        input, select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            transition: 0.2s;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        .secondary-btn {
            background: #6c757d;
        }

        .secondary-btn:hover {
            background: #5a6268;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 15px 0;
        }
    </style>
</head>
<body>
<h2>🚀 STOMP Chat Integration Test</h2>

<div class="panel">
    <strong>1. Connection (인증)</strong>
    <div class="input-group" style="margin-top:10px;">
        <label>Access Token:</label>
        <input type="text" id="token" placeholder="Bearer 제외 토큰값만 입력" style="width: 350px;">
    </div>
    <button onclick="connect()">Connect</button>
    <button class="secondary-btn" onclick="disconnect()">Disconnect</button>
</div>

<div class="panel">
    <strong>2. Message Data (페이로드 설정)</strong>
    <div class="input-group" style="margin-top:10px;">
        <label>Room ID:</label>
        <input type="number" id="roomId" value="1" style="width: 80px;">
        <span style="font-size: 12px; color: #888;"> (Long)</span>
    </div>
    <div class="input-group">
        <label>Client Msg ID:</label>
        <input type="text" id="clientMessageId" placeholder="자동 생성 (UUID)" style="width: 300px;">
        <button class="secondary-btn" style="padding: 5px 10px; font-size: 11px;" onclick="generateUUID()">Regen
        </button>
    </div>
    <div class="input-group">
        <label>Message Type:</label>
        <select id="msgType">
            <option value="TEXT">TEXT</option>
            <option value="PROPOSAL">PROPOSAL</option>
            <option value="ACCEPTED">ACCEPTED</option>
            <option value="REJECTED">REJECTED</option>
            <option value="CANCELED">CANCELED</option>
        </select>
    </div>
    <hr>
    <div class="input-group">
        <label>Content:</label>
        <input type="text" id="message" placeholder="메시지 내용 입력" style="width: 300px;">
        <button onclick="sendMessage()">Send (발송)</button>
    </div>
</div>

<div class="panel">
    <strong>3. Subscription (수신 확인용)</strong><br>
    <div class="input-group" style="margin-top:10px;">
        <input type="text" id="subPath" value="/user/chat/subscribe" style="width: 300px;" placeholder="구독 경로 입력">
        <button class="secondary-btn" onclick="subscribe()">Subscribe</button>
    </div>
</div>

<div id="logs"></div>

<script>
    let stompClient = null;
    let subscription = null;

    // 초기 UUID 생성
    window.onload = generateUUID;

    function generateUUID() {
        const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
        document.getElementById('clientMessageId').value = uuid;
    }

    function log(message, type = '') {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = type;
        div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logs.appendChild(div);
        logs.scrollTop = logs.scrollHeight;
    }

    function connect() {
        const token = document.getElementById('token').value;
        if (!token) {
            alert('토큰을 입력하세요!');
            return;
        }

        const socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);
        const headers = {'Authorization': 'Bearer ' + token};

        log("서버 연결 시도 중...", "info");

        stompClient.connect(headers, function (frame) {
            log('✅ STOMP Connected 성공!', 'success');
        }, function (error) {
            log('❌ STOMP Error: ' + error, 'error');
        });
    }

    function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            alert('먼저 서버에 연결하세요!');
            return;
        }

        const roomId = document.getElementById('roomId').value;
        const clientMessageId = document.getElementById('clientMessageId').value;
        const type = document.getElementById('msgType').value;
        const content = document.getElementById('message').value;

        // [변경사항] 수정된 ChatMessageRequest 레코드 형식 반영
        const payload = {
            roomId: parseInt(roomId),
            clientMessageId: clientMessageId,
            content: content,
            type: type,
            sentAt: new Date().toISOString() // ZonedDateTime 형식을 위해 ISO 8601 사용
        };

        const headers = {'content-type': 'application/json;charset=UTF-8'};

        stompClient.send("/pub/chat/message", headers, JSON.stringify(payload));
        log(`📤 발송: [${type}] ${content}`, 'info');

        // 발송 후 다음 메시지를 위해 UUID 갱신
        generateUUID();
        document.getElementById('message').value = '';
    }

    function subscribe() {
        if (!stompClient || !stompClient.connected) {
            alert('연결이 필요합니다!');
            return;
        }
        const path = document.getElementById('subPath').value;
        if (subscription) {
            subscription.unsubscribe();
        }

        subscription = stompClient.subscribe(path, function (msg) {
            // 수신된 JSON 예쁘게 로그 찍기
            try {
                const formatted = JSON.parse(msg.body);
                log('📩 수신 완료: ' + JSON.stringify(formatted, null, 2), 'msg');
            } catch (e) {
                log('⚠️ 수신 파싱 실패: ' + msg.body, 'error');
            }
        });
        log(`🔔 구독 시작: ${path}`, 'info');
    }

    function disconnect() {
        if (stompClient) {
            stompClient.disconnect(() => {
                log("⏹ Disconnected", "info");
            });
        }
    }
</script>
</body>
</html>
