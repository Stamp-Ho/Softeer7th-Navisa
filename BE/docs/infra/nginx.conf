# 0. WebSocket 프로토콜 전환을 위한 맵 설정
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 로깅 포맷 정의 (업스트림 상태 확인용)
log_format upstream_logging '[$time_local] to: $upstream_addr '
                           'status: $upstream_status '
                           'Upgrade: "$http_upgrade" '
                           'Conn: "$http_connection" '
                           'Host: "$host" '
                           'ServiceURL: "$service_url"';

# 1. HTTP(80) -> HTTPS(443) 리다이렉트
server {
    listen 80;
    server_name api.navisa.site;
    return 301 https://$host$request_uri;
}

# 2. HTTPS(443) 설정 및 Spring Boot 연동
server {
    listen 443 ssl;
    server_name api.navisa.site;

    access_log /var/log/nginx/upstream_access.log upstream_logging;
    error_log /var/log/nginx/upstream_error.log warn;

    # --- Certbot SSL 설정 ---
    ssl_certificate /etc/letsencrypt/live/api.navisa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.navisa.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- 공통 보안 헤더 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- Blue/Green 배포를 위한 동적 포트 파일 포함 ---
    include /etc/nginx/conf.d/service-url.inc;

    # 공통 프록시 설정 (중복 방지용)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;

    # --- [A] 일반 API 요청 블록 ---
    location /api/ {
        proxy_pass $service_url;

        # 일반 API는 빠른 응답이 중요하므로 타임아웃을 짧게 설정
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 60s;

        # 일반 HTTP 통신에는 버퍼링을 활성화하여 성능 최적화
        proxy_buffering on;
    }

    # --- [B] WebSocket 전용 블록 ---
    location /ws/ {
        proxy_pass $service_url;

        # 웹소켓 프로토콜 업그레이드 헤더 (필수)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 실시간 통신을 위해 버퍼링 비활성화 (지연 방지)
        proxy_buffering off;

        # 채팅 연결이 끊기지 않도록 타임아웃을 매우 길게 설정
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 클라이언트가 보낸 데이터가 즉시 전달되도록 설정
        proxy_cache_bypass $http_upgrade;
    }

    # --- [C] 기타 정적 리소스 혹은 기본 경로 ---
    location / {
        proxy_pass $service_url;
    }
}