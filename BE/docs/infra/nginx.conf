# 1. HTTP(80) -> HTTPS(443) 리다이렉트 설정
server {
    listen 80;
    server_name api.navisa.site;

    # 모든 HTTP 요청을 HTTPS로 강제 이동
    return 301 https://$host$request_uri;
}

# 2. HTTPS(443) 설정 및 Spring Boot 연동
server {
    listen 443 ssl;
    server_name api.navisa.site;

    # --- Certbot SSL 설정 (건드리지 마세요) ---
    ssl_certificate /etc/letsencrypt/live/api.navisa.site/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/api.navisa.site/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- 보안 헤더 추가 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- Spring Boot 프록시 설정 ---
    location / {
        # Spring Boot 기본 포트인 8080으로 요청 전달
        proxy_pass http://localhost:8080;

        # 백엔드 서버가 원래 클라이언트 정보를 알 수 있게 헤더 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
