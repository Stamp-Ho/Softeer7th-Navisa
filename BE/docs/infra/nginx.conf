# 0. WS http 통신을 upgrade하는 설정
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format upstream_logging '[$time_local] to: $upstream_addr ''status: $upstream_status ''Upgrade: "$http_upgrade" ''Conn: "$http_connection" ''Host: "$host" ''ServiceURL: "$service_url"';

# 1. HTTP(80) -> HTTPS(443) 리다이렉트 (동일)
server {
    listen 80;
    server_name api.navisa.site;
    return 301 https://$host$request_uri;
}

# 2. HTTPS(443) 설정 및 Spring Boot 연동
server {
    listen 443 ssl;
    server_name api.navisa.site;

    access_log /var/log/nginx/upstream_access.log upstream_logging;
    error_log /var/log/nginx/upstream_error.log warn;

    # --- Certbot SSL 설정 ---
    ssl_certificate /etc/letsencrypt/live/api.navisa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.navisa.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- 보안 헤더 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- 동적 포트 파일 포함 ---
    include /etc/nginx/conf.d/service-url.inc;

    # 모든 요청(API + WebSocket)을 처리하는 단일 블록
    location / {
        # Spring Boot (Blue/Green) 동적 포트 사용
        proxy_pass $service_url;

        # HTTP/1.1 필수 (웹소켓 및 성능 최적화)
        proxy_http_version 1.1;

        # Origin 헤더 명시적 전달
        proxy_set_header Origin $http_origin;

        # 웹소켓 프로토콜 전환을 위한 헤더 (핵심)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 클라이언트 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 연결 유지 시간 (채팅 중 끊김 방지)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 버퍼링 설정 (실시간 통신을 위해 꺼두는 것이 좋음)
        proxy_buffering off;
    }
}