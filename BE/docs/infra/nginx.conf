user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format upstream_logging '[$time_local] to: $upstream_addr status: $upstream_status';

    # Blue/Green 배포를 위한 upstream 설정
    # 배포 스크립트에서 이 파일을 sed로 수정: 8080 ↔ 8081
    upstream backend {
        server 127.0.0.1:8080;
    }

    # HTTP → HTTPS 리다이렉트
    server {
        listen 80;
        server_name api.navisa.site;

        # Let's Encrypt 인증서 갱신을 위한 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 나머지 모든 요청은 HTTPS로 리다이렉트
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS + WebSocket (Blue/Green 배포 지원)
    server {
        listen 443 ssl;
        server_name api.navisa.site;

        # SSL 인증서 경로
        ssl_certificate /etc/letsencrypt/live/api.navisa.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.navisa.site/privkey.pem;

        # TLS 보안 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # WebSocket 전용 (wss://)
        location /ws {
            proxy_pass http://backend;

            # WebSocket 필수 헤더
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 기본 프록시 헤더
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 타임아웃 설정
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # 일반 API 요청
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 루트 경로
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}