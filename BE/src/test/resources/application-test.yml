spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test # IntegrationTestSupport에서 동적으로 덮어씌워짐
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: debug # SQL 로그 출력
    org.hibernate.orm.jdbc.bind: trace # 쿼리 파라미터에 들어가는 실제 값 확인

jwt:
  secret: "this-is-a-test-secret-key-that-must-be-longer-than-48-bytes-for-hs384"
google:
  gemini:
    api:
      key: "dummy-test-key"
      base-url: "http://localhost:8080"
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:dummy-test-client-id}

aws:
  region: ap-northeast-2
  s3:
    bucket: test-bucket
  cloudfront:
    domain: test-cloudfront-domain