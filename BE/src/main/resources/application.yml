server:
  forward-headers-strategy: native

spring:
  application:
    name: BE
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  profiles:
    active: local

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  config:
    import: optional:file:.env[.properties]

jwt:
  secret: ${JWT_SECRET}

google:
  gemini:
    api:
      base-url: https://generativelanguage.googleapis.com/v1beta/models/
      key: ${GEMINI_API_KEY}

  oauth:
    client-id: ${GOOGLE_CLIENT_ID}

aws:
  region: ap-northeast-2
  s3:
    bucket: ${AWS_S3_BUCKET_NAME}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

navisa:
  mail:
    care-template: |
      <div style="font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; line-height: 1.6; color: #333; max-width: 600px; border: 1px solid #eee; padding: 20px;">
        <h2 style="color: #2C3E50; border-bottom: 2px solid #8D7EED; padding-bottom: 10px; margin-bottom: 10px;">안녕하세요, %s 행정사님.</h2>
        <p>Navisa 서비스 이용에 감사드립니다.</p>
        <p>행정사님께서 담당하신 비자 신청 건의 서류 내보내기가 완료된 지 어느덧 <b>2주</b>가 경과되었습니다.</p>
        <p>해당 의뢰인의 실제 비자 발급 여부를 확인하시어,</p>
        <p><b>현재 진행 상황에 맞게 시스템 상태를 업데이트</b>해 주시길 안내드립니다.</p>
        <div style="text-align: center; margin-top: 20px;">
          <a href="https://www.navisa.site/chat" style="text-decoration: underline; color: #8D7EED; font-size: 18px; font-weight: bold;">업데이트하러 가기</a>
        </div>
        <div style="background-color: #F9F9F9; padding: 20px; border-radius: 8px; margin: 20px 0;">
          <p style="margin-top: 0;"><strong>[업무 참고 사항]</strong></p>
          <ul style="margin-bottom: 0; padding-left: 20px;">
            <li>비자 발급이 완료되었다면 신청서 상태를 <b>'최종 완료'</b>로 변경해 주세요.</li>
            <li>발급 지연 또는 보완이 필요한 경우 의뢰인과 상담을 진행해 보시기 바랍니다.</li>
          </ul>
        </div>
        <p>행정사님의 신속하고 정확한 업무 관리는 의뢰인과의 신뢰 구축에 큰 도움이 됩니다.</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="font-size: 12px; color: #999;">본 메일은 시스템에 의한 자동 발송 알림입니다. 관련 문의사항은 고객센터로 연락 부탁드립니다.</p>
      </div>