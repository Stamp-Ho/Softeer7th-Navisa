title: "📌 [논의] 제목을 입력하세요"
labels: ["discussion"]

body:
  - type: markdown
    attributes:
      value: |
        ## 📌 논의 개요
        아래 항목을 작성해 주세요.

  - type: dropdown
    id: discussion_type
    attributes:
      label: 🏷️ 논의 성격
      multiple: true
      options:
        - 의사결정 필요
        - 아이디어 브레인스토밍
        - 단순 정보 공유 / 피드백 요청
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 📖 배경 및 목적
      description: 논의가 시작된 배경과 이 논의를 통해 달성하려는 목표를 적어주세요.
      placeholder: |
        예)
        - 현재 어떤 문제가 있는지
        - 왜 이 논의가 필요한지
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 💡 제안 사항 및 상세 내용
      description: 제안하는 내용이나 구체적인 상황을 설명해 주세요.
      placeholder: |
        - 제안 내용
        - 고려한 대안
        - 관련 문서 링크
        - 스크린샷
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: 📅 피드백 마감 기한
      placeholder: "202X-XX-XX"
    validations:
      required: false

  - type: textarea
    id: mention
    attributes:
      label: 🚶 논의 대상 (Mention)
      description: 의견이 필요한 사람을 멘션해주세요.
      placeholder: |
        예)
        - @username1
        - @username2
