name: BE CI
on:
  push:
    branches: ["main", "develop"]
    paths:
      - "BE/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "BE/**"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BE

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Make dummy .env file
        run: |
          echo "POSTGRES_PORT=5432" >> .env
          echo "POSTGRES_DB=test_db" >> .env
          echo "POSTGRES_USERNAME=test_user" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: ${{ github.workspace }}/BE/build/test-results/**/*.xml

      - name: Report test Coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.6.1
        if: always()
        with:
          title: 📝 Test Coverage Report
          paths: ${{ github.workspace }}/BE/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 70
          update-comment: true
          debug-mode: true
