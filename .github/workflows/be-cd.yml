name: BE CD

on:
  push:
    branches: [ "main","develop" ] # main, develop 브랜치에 푸시(PR 머지)되면 실행
    paths:
      - "BE/**"
      - ".github/workflows/be-ci.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 1. Gradle 빌드
      - name: Build with Gradle
        working-directory: ./BE
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      # 2. Docker 이미지 빌드 (Dockerfile 사용)
      - name: Build Docker Image
        working-directory: ./BE
        run: |
          docker build -t navisa-spring-app .
          docker save navisa-spring-app -o navisa-spring-app.tar

      # 3. 파일 전송 (Docker 이미지 + Nginx 설정 파일)
      - name: Copy files to remote
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          source: "BE/navisa-spring-app.tar,BE/docs/infra/nginx.conf"
          target: "~/navisa-dev"
          strip_components: 1

      # 4. 원격 서버 배포 실행
      - name: Deploy on Remote
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          script: |
            cd ~/navisa-dev

            # ==========================================
            # [Part 0] Emergency Swap & Disk Cleanup (배포 준비)
            # ==========================================
            echo "Preparing disk space and swap for deployment..."

            # 1. 이전 배포에서 남은 찌꺼기들 제거 (공간 확보)
            docker system prune -af

            # 2. 스왑 파일 생성 및 활성화 (메모리 부족 방지)
            # 이미 존재한다면 끄고 새로 만들어 깨끗한 상태로 시작
            sudo swapoff /swapfile 2>/dev/null || true
            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo "Swap enabled (2GB)."
            
            # ==========================================
            # [Part 1] Blue/Green Info Setup
            # ==========================================
            echo "Identifying target environment..."
            
            # 컨테이너 실행 여부를 이름으로 체크 (가장 확실한 방법)
            if [ $(docker ps -q -f name=navisa-spring-app-blue) ]; then
              echo "Current is BLUE -> Target is GREEN (8081)"
              TARGET_NAME="navisa-spring-app-green"
              TARGET_PORT=8081
              CURRENT_NAME="navisa-spring-app-blue"
            else
              echo "Current is GREEN (or none) -> Target is BLUE (8080)"
              TARGET_NAME="navisa-spring-app-blue"
              TARGET_PORT=8080
              CURRENT_NAME="navisa-spring-app-green"
            fi

            # ==========================================
            # [Part 2] New Container Deployment
            # ==========================================
            echo "Loading Docker image..."
            docker load -i navisa-spring-app.tar

            # 기존에 혹시나 남아있을 타겟 컨테이너/포트 강제 정리
            echo "Cleaning up $TARGET_NAME if exists..."
            docker rm -f $TARGET_NAME 2>/dev/null || true
            
            echo "Starting new container ($TARGET_NAME) on port $TARGET_PORT..."
            docker run -d \
              --name $TARGET_NAME \
              -p $TARGET_PORT:8080 \
              -e SPRING_PROFILES_ACTIVE=remote \
              -e POSTGRES_HOST=${{ secrets.POSTGRES_HOST }} \
              -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
              -e POSTGRES_PORT=${{ secrets.POSTGRES_PORT }} \
              -e POSTGRES_USERNAME=${{ secrets.POSTGRES_USERNAME }} \
              -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
              -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
              -e REDIS_PORT=${{ secrets.REDIS_PORT }} \
              -e AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }} \
              -e AWS_CLOUDFRONT_DOMAIN=${{ secrets.AWS_CLOUDFRONT_DOMAIN }} \
              -e MAIL_USERNAME=${{ secrets.MAIL_USERNAME }} \
              -e MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }} \
              --restart unless-stopped \
              navisa-spring-app
            
            rm navisa-spring-app.tar

            # ==========================================
            # [Part 3] Health Check (강화됨)
            # ==========================================
            echo "Health checking $TARGET_NAME at port $TARGET_PORT..."
            
            MAX_RETRIES=15  # JVM 기동 시간을 고려해 횟수 상향
            COUNT=0
            SUCCESS=0
            
            # 애플리케이션 내부 로직이 준비될 때까지 대기
            while [ $COUNT -lt $MAX_RETRIES ]; do
              # 컨테이너 생존 여부 확인
              if [ -z "$(docker ps -q -f name=$TARGET_NAME)" ]; then
                  echo "❌ Container $TARGET_NAME died! Checking logs..."
                  docker logs --tail 50 $TARGET_NAME
                  exit 1
              fi

              # 실제 HTTP 응답 확인
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$TARGET_PORT/swagger-ui/index.html || echo "000")
              
              if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "302" ]; then
                 echo "✅ Health Check Passed! (HTTP $RESPONSE)"
                 SUCCESS=1
                 break
              fi
              
              echo "Waiting for Spring Boot... ($((COUNT+1))/$MAX_RETRIES)"
              sleep 10
              COUNT=$((COUNT+1))
            done
            
            if [ $SUCCESS -eq 0 ]; then
              echo "❌ Health Check Timeout! Rolling back..."
              docker logs --tail 100 $TARGET_NAME
              docker stop $TARGET_NAME && docker rm $TARGET_NAME
              exit 1
            fi

            # ==========================================
            # [Part 4] Switch Traffic (Nginx)
            # ==========================================
            echo "Switching Nginx traffic to $TARGET_PORT..."

            # 1. 현재 설정 백업
            sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak

            # 2. 새로운 설정 파일 적용 (Repo에서 가져온 최신 nginx.conf)
            sudo cp ~/navisa-dev/docs/infra/nginx.conf /etc/nginx/nginx.conf

            # 3. 포트 설정 변경 (sed로 upstream 포트 수정)
            # server 127.0.0.1:xxxx; 패턴을 찾아 $TARGET_PORT로 변경
            sudo sed -i "s/server 127.0.0.1:[0-9]*;/server 127.0.0.1:$TARGET_PORT;/g" /etc/nginx/nginx.conf

            # 4. Nginx 문법 검사
            if ! sudo nginx -t; then
              echo "❌ Nginx config test failed! Rolling back..."
              # 백업 복원
              sudo mv /etc/nginx/nginx.conf.bak /etc/nginx/nginx.conf
              sudo systemctl reload nginx
              # 새 컨테이너 정리
              docker stop $TARGET_NAME && docker rm $TARGET_NAME
              exit 1
            fi

            # 5. 검증 성공 시 트래픽 전환
            sudo systemctl reload nginx
            sudo rm -f /etc/nginx/nginx.conf.bak
            echo "Traffic successfully switched."

            # ==========================================
            # [Part 5] Cleanup Old Container
            # ==========================================
            if [ $(docker ps -q -f name=$CURRENT_NAME) ]; then
              echo "Stopping old container ($CURRENT_NAME)..."
              docker stop $CURRENT_NAME && docker rm $CURRENT_NAME
            fi

            docker system prune -af
            echo "Deactivating and removing swap to save disk space..."
            sudo swapoff /swapfile
            sudo rm /swapfile
            
            echo "🚀 Deployment Completed Successfully!"
