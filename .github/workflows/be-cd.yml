name: BE CD

on:
  push:
    branches: [ "main","develop" ] # main, develop 브랜치에 푸시(PR 머지)되면 실행
    paths:
      - "BE/**"
      - ".github/workflows/be-ci.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 1. Gradle 빌드
      - name: Build with Gradle
        working-directory: ./BE
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      # 2. Docker 이미지 빌드 (Dockerfile 사용)
      - name: Build Docker Image
        working-directory: ./BE
        run: |
          docker build -t navisa-spring-app .
          docker save navisa-spring-app -o navisa-spring-app.tar

      # 3. 파일 전송 (Docker 이미지 + Nginx 설정 파일)
      - name: Copy files to remote
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          source: "BE/navisa-spring-app.tar,BE/docs/infra/nginx.conf"
          target: "~/navisa-dev"
          strip_components: 1

      # 4. 원격 서버 배포 실행
      - name: Deploy on Remote
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          script: |
            cd ~/navisa-dev
            
            # ==========================================
            # [Part 1] Spring Boot Docker 배포
            # ==========================================
            echo "Loading Docker image..."
            docker load -i navisa-spring-app.tar
            
            if [ "$(docker ps -aq -f name=navisa-spring-app)" ]; then
                echo "Stopping existing container..."
                docker stop navisa-spring-app
                docker rm navisa-spring-app
            fi
            
            docker image prune -f
            
            echo "Starting new container..."
            docker run -d \
              --name navisa-spring-app \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=remote \
              -e POSTGRES_HOST=${{ secrets.POSTGRES_HOST }} \
              -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
              -e POSTGRES_PORT=${{ secrets.POSTGRES_PORT }} \
              -e POSTGRES_USERNAME=${{ secrets.POSTGRES_USERNAME }} \
              -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
              -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
              -e REDIS_PORT=${{ secrets.REDIS_PORT }} \
              -e AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }} \
              -e AWS_CLOUDFRONT_DOMAIN=${{ secrets.AWS_CLOUDFRONT_DOMAIN }} \
              navisa-spring-app
            
            rm navisa-spring-app.tar
            
            # ==========================================
            # [Part 2] Nginx 설정 배포 및 적용
            # ==========================================
            echo "Updating Nginx configuration..."
            sudo cp ~/navisa-dev/docs/infra/nginx.conf /etc/nginx/sites-available/api.navisa.site
            sudo nginx -t
            
            # 검사 결과($?)가 성공(0)이면 재시작
            if [ $? -eq 0 ]; then
                sudo systemctl reload nginx
                echo "Nginx reloaded successfully."
            else
                echo "❌ Nginx configuration test failed! Not reloading."
                # 배포 실패로 처리하려면 아래 exit 1 주석 해제
                # exit 1
            fi
